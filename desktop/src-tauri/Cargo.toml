[package]
name = "skyfit-evo-desktop"
version = "1.0.3"
description = "Skyfit EVO desktop launcher"
authors = ["Skyfit"]
edition = "2021"
build = "build.rs"

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-single-instance = "2"
tar = "0.4"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
zstd = "0.13"

[build-dependencies]
tauri-build = { version = "2", features = [] }
tar = "0.4"
zstd = "0.13"
