<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Skyfit EVO</title>
		<style>
			:root {
				color-scheme: dark;
				font-family:
					Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				background: #09090b;
				color: #fafafa;
			}

			body {
				align-items: center;
				display: flex;
				height: 100vh;
				justify-content: center;
				margin: 0;
			}

			main {
				border: 1px solid #27272a;
				border-radius: 16px;
				background: #111113;
				box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
				padding: 28px;
				width: min(360px, calc(100vw - 48px));
			}

			h1 {
				font-size: 22px;
				line-height: 1.2;
				margin: 0 0 12px;
			}

			p {
				color: #d4d4d8;
				font-size: 14px;
				line-height: 1.5;
				margin: 0;
			}

			.loader {
				background: #27272a;
				border-radius: 999px;
				height: 6px;
				margin-top: 22px;
				overflow: hidden;
			}

			.loader::before {
				animation: loading 1.2s ease-in-out infinite;
				background: #22c55e;
				border-radius: inherit;
				content: "";
				display: block;
				height: 100%;
				width: 42%;
			}

			#error {
				color: #fca5a5;
				display: none;
				margin-top: 16px;
				white-space: pre-wrap;
			}

			@keyframes loading {
				0% {
					transform: translateX(-110%);
				}
				100% {
					transform: translateX(260%);
				}
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Skyfit EVO</h1>
			<p id="status">Preparando o aplicativo local...</p>
			<p id="error"></p>
			<div class="loader" aria-hidden="true"></div>
		</main>
		<script>
			window.setStartupStatus = (message, isError = false) => {
				const status = document.getElementById('status');
				const error = document.getElementById('error');
				if (status) status.textContent = message;
				if (error) {
					error.textContent = isError ? message : '';
					error.style.display = isError ? 'block' : 'none';
				}
			};
		</script>
	</body>
</html>
